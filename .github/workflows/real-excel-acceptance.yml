name: real Excel acceptance
on:
  push:
    branches: [v5.1-real-excel-test]
  workflow_dispatch:

jobs:
  real-excel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Prepare patched runtime
        run: |
          set -euo pipefail
          rm -f data.db data.db-shm data.db-wal
          python3 .github/patch_rc.py
          python3 .github/business_logic_patch_v2.py
          python3 .github/business_logic_patch_v3.py
          python3 .github/business_logic_patch_v4.py
          python3 .github/real_excel_frontend_patch.py
          node --check server.js
          node -e "const fs=require('fs'),vm=require('vm'); const h=fs.readFileSync('public/index.html','utf8'); const b=[...h.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)].map(m=>m[1]).filter(Boolean); b.forEach((s,i)=>new vm.Script(s,{filename:'index-'+(i+1)+'.js'})); console.log('frontend scripts checked:',b.length);"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Import exact workbook-shape fixture and validate boards
        shell: bash
        run: |
          set -euo pipefail
          PORT=3150 SESSION_SECRET=real-excel-test DEFAULT_ADMIN_PASSWORD=admin123 node server.js >/tmp/real.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true; cat /tmp/real.log' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3150/api/health >/tmp/health.json && break || sleep 1; done
          grep -q '\"ok\":true' /tmp/health.json
          cat >/tmp/login.json <<'JSON'
          {"username":"admin","password":"admin123"}
          JSON
          curl -fsS -c /tmp/cookies.txt -H 'Content-Type: application/json' --data-binary @/tmp/login.json http://127.0.0.1:3150/api/auth/login >/tmp/login-result.json
          curl -fsS -b /tmp/cookies.txt http://127.0.0.1:3150/api/auth/status >/tmp/auth.json
          CSRF=$(python3 -c 'import json; print(json.load(open("/tmp/auth.json"))["user"]["csrf_token"])')

          curl -fsS -b /tmp/cookies.txt -H "x-csrf-token: $CSRF" -H 'Content-Type: application/json' -d '{"products":[{"product_code":"P-001","product_name":"主数据覆盖","mold":"MASTER-DIE","process":"M01","capacity":2000,"mold_change_time":15,"machines":"M01"}]}' http://127.0.0.1:3150/api/product-data/batch-import >/tmp/master-result.json

          cp test-data/real_excel_rows.json /tmp/rows.json
          curl -fsS -b /tmp/cookies.txt -H "x-csrf-token: $CSRF" -H 'Content-Type: application/json' --data-binary @/tmp/rows.json http://127.0.0.1:3150/api/workflow/import >/tmp/import.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/import.json'))
          print(json.dumps({'success':d.get('success'),'count':d.get('count'),'stages':d.get('stages')},ensure_ascii=False))
          assert d.get('success') is True, d
          assert d.get('count') == 7, d
          st=d.get('stages',{})
          assert st.get('waiting_schedule') == 2, st
          assert st.get('available_to_issue') == 1, st
          assert st.get('shortage') == 1, st
          assert st.get('in_process') == 2, st
          assert st.get('completed') == 1, st
          PY
          for s in shortage available_to_issue waiting_schedule in_process; do curl -fsS -b /tmp/cookies.txt "http://127.0.0.1:3150/api/workflow/board?stage=$s" >/tmp/$s.json; done
          python3 - <<'PY'
          import json
          for s in ['shortage','available_to_issue','waiting_schedule','in_process']:
            d=json.load(open('/tmp/'+s+'.json'))
            assert d.get('success') is True and d.get('count') > 0, (s,d)
            assert d.get('product_shortages',[]) == [], (s,d)
          w={x['order_number']:x for x in json.load(open('/tmp/waiting_schedule.json'))['rows']}
          assert w['WO-001']['shipping_required_date']=='2026-08-27',w['WO-001']
          assert w['WO-002']['shipping_required_date'] is None,w['WO-002']
          assert w['WO-002']['workflow_expected_date']=='2026-08-19',w['WO-002']
          assert w['WO-001']['mold']=='MASTER-DIE' and w['WO-001']['process']=='M01' and int(w['WO-001']['capacity'])==2000 and int(w['WO-001']['mold_change_time'])==15,w['WO-001']
          print('REAL EXCEL SHAPE BOARD ACCEPTANCE PASSED')
          PY

          curl -fsS -b /tmp/cookies.txt -H "x-csrf-token: $CSRF" -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:3150/api/schedule/auto-run >/tmp/auto.json
          curl -fsS -b /tmp/cookies.txt http://127.0.0.1:3150/api/schedules >/tmp/schedules.json
          curl -fsS -b /tmp/cookies.txt 'http://127.0.0.1:3150/api/workflow/board?stage=waiting_schedule' >/tmp/after.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/auto.json')); assert a.get('success') is True,a
          after=json.load(open('/tmp/after.json')); rows={r['order_number']:r for r in after['rows']}
          assert rows['WO-001']['order_status']=='scheduled' and rows['WO-001']['workflow_production_progress']=='已排待制',rows['WO-001']
          assert rows['WO-002']['order_status']=='scheduled' and rows['WO-002']['workflow_production_progress']=='已排待制',rows['WO-002']
          s=json.load(open('/tmp/schedules.json'))['schedules']; chosen=[x for x in s if x['order_id'] in {rows['WO-001']['order_id'],rows['WO-002']['order_id']}]
          assert len(chosen)==2,chosen
          assert min(chosen,key=lambda x:x['start_time'])['order_id']==rows['WO-001']['order_id'],chosen
          print('REAL EXCEL + PRODUCT MASTER + SCHEDULING ACCEPTANCE PASSED')
          PY

      - name: Package verified runtime
        run: |
          set -euo pipefail
          rm -f V5.1.2-REAL-EXCEL-VERIFIED.zip
          zip -r V5.1.2-REAL-EXCEL-VERIFIED.zip server.js public/index.html package.json
      - uses: actions/upload-artifact@v4
        with:
          name: V5.1.2-REAL-EXCEL-VERIFIED
          path: V5.1.2-REAL-EXCEL-VERIFIED.zip
          retention-days: 7
