name: assemble-server
on:
  push:
    branches: [v5.1-due-date-priority]
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble exact server.js
        run: cat server.js.part-* > server.js
      - name: Verify exact size and syntax
        run: node --check server.js && test "$(wc -c < server.js)" -eq 85847
      - name: Commit assembled server.js
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server.js
          git diff --cached --quiet || git commit -m 'V5.1: sync complete server.js from V5 ZIP'
          git push
