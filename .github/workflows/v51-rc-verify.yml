name: v5.1 rc verify

on:
  push:
    branches:
      - v5.1-release-candidate
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare public
        shell: bash
        run: |
          set -e
          mkdir -p public
          cp index.html public/index.html
          rm -f data.db data.db-shm data.db-wal

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Backend syntax
        run: node --check server.js

      - name: Frontend syntax
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('public/index.html','utf8');
          const blocks = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
            .map(m => m[1]).filter(Boolean);
          if (!blocks.length) throw new Error('no inline script');
          for (let i=0;i<blocks.length;i++) new vm.Script(blocks[i], {filename:`index-${i+1}.js`});
          console.log('inline scripts:', blocks.length);
          NODE

      - name: Start clean server
        shell: bash
        run: |
          set -e
          PORT=3100 SESSION_SECRET=ci-test-secret DEFAULT_ADMIN_PASSWORD=admin123 node server.js > /tmp/server.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true; cat /tmp/server.log' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/api/health > /tmp/health.json; then break; fi
            sleep 1
          done
          test -s /tmp/health.json
          cat /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
