name: v5.1 rc verify

on:
  push:
    branches:
      - v5.1-release-candidate
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare runtime and patch fresh-db initialization
        shell: bash
        run: |
          set -e
          mkdir -p public
          cp index.html public/index.html
          rm -f data.db data.db-shm data.db-wal
          python3 -c 'from pathlib import Path; p=Path("server.js"); s=p.read_text(encoding="utf-8"); old="ensureColumn(\'workflow_snapshots\', \'shipping_required_date\', \'TEXT\');\\nensureColumn(\'workflow_snapshots\', \'delivery_date\', \'TEXT\');\\nensureColumn(\'workflow_snapshots\', \'expected_ready_date\', \'TEXT\');\\nensureColumn(\'workflow_snapshots\', \'expected_issue_date\', \'TEXT\');\\nensureColumn(\'workflow_snapshots\', \'expected_start_date\', \'TEXT\');\\nensureColumn(\'workflow_snapshots\', \'expected_finish_date\', \'TEXT\');\\nensureColumn(\'workflow_snapshots\', \'production_progress\', \'TEXT\');\\nensureColumn(\'workflow_snapshots\', \'material_status\', \'TEXT\');\\nensureColumn(\'workflow_snapshots\', \'shortage_detail\', \'TEXT\');\\n\\n\\n// V5.1 生产四板块/每日快照\\n"; s2=s.replace(old,"\\n\\n// V5.1 生产四板块/每日快照\\n",1); anchor="  CREATE TABLE IF NOT EXISTS workflow_daily_kpi (\\n    kpi_date TEXT NOT NULL,\\n    stage TEXT NOT NULL,\\n    expected_count INTEGER DEFAULT 0,\\n    actual_count INTEGER DEFAULT 0,\\n    rate REAL DEFAULT 0,\\n    alert_count INTEGER DEFAULT 0,\\n    notes TEXT,\\n    PRIMARY KEY(kpi_date, stage)\\n  );\\n`);\\n\\nfunction hashPassword"; insert="  CREATE TABLE IF NOT EXISTS workflow_daily_kpi (\\n    kpi_date TEXT NOT NULL,\\n    stage TEXT NOT NULL,\\n    expected_count INTEGER DEFAULT 0,\\n    actual_count INTEGER DEFAULT 0,\\n    rate REAL DEFAULT 0,\\n    alert_count INTEGER DEFAULT 0,\\n    notes TEXT,\\n    PRIMARY KEY(kpi_date, stage)\\n  );\\n`);\\n\\nensureColumn(\'workflow_snapshots\', \'shipping_required_date\', \'TEXT\');\\nensureColumn(\'workflow_snapshots\', \'delivery_date\', \'TEXT\');\\nensureColumn(\'workflow_snapshots\', \'expected_ready_date\', \'TEXT\');\\nensureColumn(\'workflow_snapshots\', \'expected_issue_date\', \'TEXT\');\\nensureColumn(\'workflow_snapshots\', \'expected_start_date\', \'TEXT\');\\nensureColumn(\'workflow_snapshots\', \'expected_finish_date\', \'TEXT\');\\nensureColumn(\'workflow_snapshots\', \'production_progress\', \'TEXT\');\\nensureColumn(\'workflow_snapshots\', \'material_status\', \'TEXT\');\\nensureColumn(\'workflow_snapshots\', \'shortage_detail\', \'TEXT\');\\n\\nfunction hashPassword"; assert s2!=s and anchor in s2; s2=s2.replace(anchor,insert,1); p.write_text(s2,encoding="utf-8")'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Backend syntax
        run: node --check server.js

      - name: Frontend syntax
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('public/index.html','utf8');
          const blocks = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          if (!blocks.length) throw new Error('no inline script');
          for (let i=0;i<blocks.length;i++) new vm.Script(blocks[i], {filename:`index-${i+1}.js`});
          console.log('inline scripts:', blocks.length);
          NODE

      - name: Start clean server
        shell: bash
        run: |
          set -e
          PORT=3100 SESSION_SECRET=ci-test-secret DEFAULT_ADMIN_PASSWORD=admin123 node server.js > /tmp/server.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true; cat /tmp/server.log' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/api/health > /tmp/health.json; then break; fi
            if ! kill -0 $pid 2>/dev/null; then cat /tmp/server.log; exit 1; fi
            sleep 1
          done
          test -s /tmp/health.json
          cat /tmp/health.json
          grep -q '"ok":true' /tmp/health.json

      - name: Workflow integration
        shell: bash
        run: |
          set -e
          curl -fsS -c /tmp/cookies.txt -H 'Content-Type: application/json' -d '{"username":"admin","password":"admin123"}' http://127.0.0.1:3100/api/auth/login >/tmp/login.json
          curl -fsS -b /tmp/cookies.txt http://127.0.0.1:3100/api/auth/status >/tmp/auth.json
          CSRF=$(python3 -c 'import json; print(json.load(open("/tmp/auth.json"))["user"]["csrf_token"])')
          cat > /tmp/fixture1.json <<'JSON'
          {"filename":"ci-fixture.xlsx","snapshot_date":"2026-08-26","rows":[{"__sheet_name":"8.22在制工单明细","生产工单":"WO-SHORT","产品品号":"P-SHORT","品名":"欠料测试","工单数量":1000,"要求出货时间":"2026-08-27","生产进度":"未发料","是否齐料":"欠料","欠料明细":"欠料，8/27齐料"},{"__sheet_name":"8.22在制工单明细","生产工单":"WO-ISSUE","产品品号":"P-ISSUE","品名":"有料测试","工单数量":2000,"要求出货时间":"2026-08-27","生产进度":"未发料","是否齐料":"仓库有料","欠料明细":"8.21查料"},{"__sheet_name":"8.22在制工单明细","生产工单":"WO-WAIT","产品品号":"P-WAIT","品名":"待排测试","工单数量":3000,"要求出货时间":"2026-08-28","预计开工":"2026-08-26","生产进度":"车间待排","是否齐料":"齐料","欠料明细":""},{"__sheet_name":"8.22在制工单明细","生产工单":"WO-RUN","产品品号":"P-RUN","品名":"在制测试","工单数量":4000,"要求出货时间":"2026-08-29","生产进度":"车间在制","是否齐料":"齐料","欠料明细":"上机"}]}
          JSON
          curl -fsS -b /tmp/cookies.txt -H "x-csrf-token: $CSRF" -H 'Content-Type: application/json' --data-binary @/tmp/fixture1.json http://127.0.0.1:3100/api/workflow/import >/tmp/import1.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/import1.json'))
          assert d['success'] and d['count']==4, d
          got=d['stages']
          assert got.get('shortage')==1 and got.get('available_to_issue')==1 and got.get('waiting_schedule')==1 and got.get('in_process')==1, got
          PY
          for s in shortage available_to_issue waiting_schedule in_process; do curl -fsS -b /tmp/cookies.txt "http://127.0.0.1:3100/api/workflow/board?stage=$s" >/tmp/$s.json; done
          python3 - <<'PY'
          import json
          for s in ['shortage','available_to_issue','waiting_schedule','in_process']:
              d=json.load(open('/tmp/'+s+'.json'))
              assert d['success'] and d['count']==1 and d.get('product_shortages',[])==[], (s,d)
          w=json.load(open('/tmp/waiting_schedule.json'))['rows'][0]
          r=json.load(open('/tmp/in_process.json'))['rows'][0]
          assert w['shipping_required_date']=='2026-08-28', w
          assert r['shipping_required_date']=='2026-08-29', r
          PY
          cat > /tmp/fixture2.json <<'JSON'
          {"filename":"ci-fixture-next.xlsx","snapshot_date":"2026-08-27","rows":[{"__sheet_name":"8.22在制工单明细","生产工单":"WO-NEW","产品品号":"P-NEW","品名":"新待排","工单数量":500,"要求出货时间":"2026-08-30","预计开工":"2026-08-27","生产进度":"车间待排","是否齐料":"齐料","欠料明细":""}]}
          JSON
          curl -fsS -b /tmp/cookies.txt -H "x-csrf-token: $CSRF" -H 'Content-Type: application/json' --data-binary @/tmp/fixture2.json http://127.0.0.1:3100/api/workflow/import >/tmp/import2.json
          curl -fsS -b /tmp/cookies.txt "http://127.0.0.1:3100/api/workflow/board?stage=shortage" >/tmp/next-shortage.json
          curl -fsS -b /tmp/cookies.txt "http://127.0.0.1:3100/api/workflow/board?stage=waiting_schedule" >/tmp/next-waiting.json
          python3 - <<'PY'
          import json
          sh=json.load(open('/tmp/next-shortage.json')); wa=json.load(open('/tmp/next-waiting.json'))
          assert sh['count']==0, sh
          assert wa['count']==1 and wa['rows'][0]['order_number']=='WO-NEW', wa
          PY

      - name: Publish verified runtime layout
        if: success()
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js public/index.html
          git rm -f index.html || true
          git commit -m 'release: V5.1.1 verified runtime layout [skip ci]' || true
          git push

      - name: Cleanup
        if: always()
        shell: bash
        run: cat /tmp/server.log || true
