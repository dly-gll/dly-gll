name: V5.1 final board to schedule acceptance

on:
  push:
    branches: [v5.1-release-candidate]
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static UI acceptance
        run: |
          set -e
          test -f public/index.html
          grep -q 'id="scheduleSubnav"' public/index.html
          grep -q 'data-workflow-stage="shortage"' public/index.html
          grep -q 'data-workflow-stage="available_to_issue"' public/index.html
          grep -q 'data-workflow-stage="waiting_schedule"' public/index.html
          grep -q 'data-workflow-stage="in_process"' public/index.html
          grep -q 'switchWorkflowStageFromSidebar' public/index.html
          grep -q 'updateScheduleSidebar' public/index.html
          grep -q "currentSubTab = 'gantt'" public/index.html
          ! grep -q "tabs=\[\['shortage','欠料'" public/index.html

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Runtime acceptance
        shell: bash
        run: |
          set -euo pipefail
          rm -f data.db data.db-shm data.db-wal
          PORT=3120 SESSION_SECRET=acceptance-secret DEFAULT_ADMIN_PASSWORD=admin123 node server.js >/tmp/acceptance.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true; cat /tmp/acceptance.log' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3120/api/health >/tmp/health.json; then break; fi
            if ! kill -0 $pid 2>/dev/null; then cat /tmp/acceptance.log; exit 1; fi
            sleep 1
          done
          grep -q '"ok":true' /tmp/health.json

          curl -fsS -c /tmp/cookies.txt -H 'Content-Type: application/json' -d '{"username":"admin","password":"admin123"}' http://127.0.0.1:3120/api/auth/login >/tmp/login.json
          curl -fsS -b /tmp/cookies.txt http://127.0.0.1:3120/api/auth/status >/tmp/auth.json
          CSRF=$(python3 -c 'import json; print(json.load(open("/tmp/auth.json"))["user"]["csrf_token"])')

          cat >/tmp/master.json <<'JSON'
          {"products":[{"product_code":"A-MASTER","product_name":"主数据优先","mold":"MASTER-MOLD","process":"平压平1号","capacity":2000,"mold_change_time":15,"machines":"平压平1号"}]}
          JSON
          curl -fsS -b /tmp/cookies.txt -H "x-csrf-token: $CSRF" -H 'Content-Type: application/json' --data-binary @/tmp/master.json http://127.0.0.1:3120/api/product-data/batch-import >/tmp/master-result.json

          cat >/tmp/workflow.json <<'JSON'
          {"filename":"acceptance.xlsx","snapshot_date":"2026-08-27","rows":[
            {"__sheet_name":"在制工单明细","生产工单":"A-URGENT","产品品号":"A-MASTER","品名":"急件","工单数量":1000,"要求出货时间":"2026-08-27","预计开工":"2026-08-29","生产进度":"车间待排","是否齐料":"齐料","设备":"错误设备","刀模":"错误刀模","产能":100,"换模时间":99},
            {"__sheet_name":"在制工单明细","生产工单":"A-DERIVED","产品品号":"A-MASTER","品名":"无要求出货时间","工单数量":1000,"预计开工":"2026-08-29","生产进度":"车间待排","是否齐料":"齐料","设备":"错误设备2","刀模":"错误刀模2","产能":100,"换模时间":99}
          ]}
          JSON
          curl -fsS -b /tmp/cookies.txt -H "x-csrf-token: $CSRF" -H 'Content-Type: application/json' --data-binary @/tmp/workflow.json http://127.0.0.1:3120/api/workflow/import >/tmp/import.json
          curl -fsS -b /tmp/cookies.txt 'http://127.0.0.1:3120/api/workflow/board?stage=waiting_schedule' >/tmp/board.json

          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/board.json'))
          assert d['success'] and d['count']==2,d
          rows={r['order_number']:r for r in d['rows']}
          assert set(rows)=={'A-URGENT','A-DERIVED'},rows
          for wo in rows:
              assert rows[wo]['mold']=='MASTER-MOLD',rows[wo]
              assert rows[wo]['process']=='平压平1号',rows[wo]
              assert int(rows[wo]['capacity'])==2000,rows[wo]
          assert rows['A-DERIVED']['workflow_expected_date']=='2026-08-29',rows['A-DERIVED']
          assert d.get('product_shortages',[])==[],d
          print('board acceptance passed')
          PY

          curl -fsS -b /tmp/cookies.txt -H "x-csrf-token: $CSRF" -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:3120/api/schedule/auto-run >/tmp/auto.json
          curl -fsS -b /tmp/cookies.txt http://127.0.0.1:3120/api/schedules >/tmp/schedules.json
          curl -fsS -b /tmp/cookies.txt 'http://127.0.0.1:3120/api/workflow/board?stage=waiting_schedule' >/tmp/board-after.json

          python3 - <<'PY'
          import json
          auto=json.load(open('/tmp/auto.json'))
          assert auto['success'] is True,auto
          after=json.load(open('/tmp/board-after.json'))
          rows={r['order_number']:r for r in after['rows']}
          assert rows['A-URGENT']['order_status']=='scheduled',rows['A-URGENT']
          assert rows['A-DERIVED']['order_status']=='scheduled',rows['A-DERIVED']
          assert rows['A-URGENT']['workflow_production_progress']=='已排待制',rows['A-URGENT']
          assert rows['A-DERIVED']['workflow_production_progress']=='已排待制',rows['A-DERIVED']
          schedules=json.load(open('/tmp/schedules.json'))['schedules']
          chosen=[x for x in schedules if x['order_id'] in {rows['A-URGENT']['order_id'],rows['A-DERIVED']['order_id']}]
          assert len(chosen)==2,chosen
          first=min(chosen,key=lambda x:x['start_time'])
          assert first['order_id']==rows['A-URGENT']['order_id'],(rows,chosen)
          print('schedule acceptance passed: waiting-only, due-date-first, product-master-first, status=已排待制')
          PY

      - name: Final build sanity
        run: |
          set -e
          node --check server.js
          test -s public/index.html
          echo "V5.1.2 final acceptance workflow completed"
