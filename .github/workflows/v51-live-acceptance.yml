name: V5.1 live acceptance

on:
  push:
    branches: [v5.1-release-candidate]
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: UI
        run: |
          set -e
          test -f public/index.html
          grep -q 'id="scheduleSubnav"' public/index.html
          grep -q 'data-workflow-stage="shortage"' public/index.html
          grep -q 'data-workflow-stage="available_to_issue"' public/index.html
          grep -q 'data-workflow-stage="waiting_schedule"' public/index.html
          grep -q 'data-workflow-stage="in_process"' public/index.html
          grep -q 'switchWorkflowStageFromSidebar' public/index.html
          grep -q 'updateScheduleSidebar' public/index.html
      - name: Runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -f data.db data.db-shm data.db-wal
          npm install --no-audit --no-fund
          PORT=3130 SESSION_SECRET=live-acceptance DEFAULT_ADMIN_PASSWORD=admin123 node server.js >/tmp/live.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true; cat /tmp/live.log' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3130/api/health >/tmp/health.json && break || sleep 1; done
          grep -q '"ok":true' /tmp/health.json
          curl -fsS -c /tmp/cookies.txt -H 'Content-Type: application/json' -d '{"username":"admin","password":"admin123"}' http://127.0.0.1:3130/api/auth/login >/tmp/login.json
          curl -fsS -b /tmp/cookies.txt http://127.0.0.1:3130/api/auth/status >/tmp/auth.json
          CSRF=$(python3 -c 'import json; print(json.load(open("/tmp/auth.json"))["user"]["csrf_token"])')
          cat >/tmp/master.json <<'JSON'
          {"products":[{"product_code":"LIVE-MASTER","product_name":"主数据优先","mold":"MASTER-MOLD","process":"平压平1号","capacity":2000,"mold_change_time":15,"machines":"平压平1号"}]}
          JSON
          curl -fsS -b /tmp/cookies.txt -H "x-csrf-token: $CSRF" -H 'Content-Type: application/json' --data-binary @/tmp/master.json http://127.0.0.1:3130/api/product-data/batch-import >/tmp/master-result.json
          cat >/tmp/workflow.json <<'JSON'
          {"filename":"live.xlsx","snapshot_date":"2026-08-27","rows":[
          {"__sheet_name":"在制工单明细","生产工单":"LIVE-URGENT","产品品号":"LIVE-MASTER","品名":"急件","工单数量":1000,"要求出货时间":"2026-08-27","预计开工":"2026-08-29","生产进度":"车间待排","是否齐料":"齐料","设备":"错误设备","刀模":"错误刀模","产能":100,"换模时间":99},
          {"__sheet_name":"在制工单明细","生产工单":"LIVE-DERIVED","产品品号":"LIVE-MASTER","品名":"无出货日期","工单数量":1000,"预计开工":"2026-08-29","生产进度":"车间待排","是否齐料":"齐料","设备":"错误设备2","刀模":"错误刀模2","产能":100,"换模时间":99}]}
          JSON
          curl -fsS -b /tmp/cookies.txt -H "x-csrf-token: $CSRF" -H 'Content-Type: application/json' --data-binary @/tmp/workflow.json http://127.0.0.1:3130/api/workflow/import >/tmp/import.json
          curl -fsS -b /tmp/cookies.txt 'http://127.0.0.1:3130/api/workflow/board?stage=waiting_schedule' >/tmp/board.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/board.json')); assert d['success'] and d['count']==2,d
          rows={r['order_number']:r for r in d['rows']}
          assert set(rows)=={'LIVE-URGENT','LIVE-DERIVED'},rows
          for r in rows.values():
              assert r['mold']=='MASTER-MOLD',r
              assert r['process']=='平压平1号',r
              assert int(r['capacity'])==2000,r
          assert rows['LIVE-DERIVED']['workflow_expected_date']=='2026-08-29',rows['LIVE-DERIVED']
          PY
          curl -fsS -b /tmp/cookies.txt -H "x-csrf-token: $CSRF" -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:3130/api/schedule/auto-run >/tmp/auto.json
          curl -fsS -b /tmp/cookies.txt http://127.0.0.1:3130/api/schedules >/tmp/schedules.json
          curl -fsS -b /tmp/cookies.txt 'http://127.0.0.1:3130/api/workflow/board?stage=waiting_schedule' >/tmp/after.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/auto.json')); assert a['success'] is True,a
          after=json.load(open('/tmp/after.json')); rows={r['order_number']:r for r in after['rows']}
          assert rows['LIVE-URGENT']['order_status']=='scheduled',rows['LIVE-URGENT']
          assert rows['LIVE-DERIVED']['order_status']=='scheduled',rows['LIVE-DERIVED']
          assert rows['LIVE-URGENT']['workflow_production_progress']=='已排待制',rows['LIVE-URGENT']
          assert rows['LIVE-DERIVED']['workflow_production_progress']=='已排待制',rows['LIVE-DERIVED']
          schedules=json.load(open('/tmp/schedules.json'))['schedules']; chosen=[x for x in schedules if x['order_id'] in {rows['LIVE-URGENT']['order_id'],rows['LIVE-DERIVED']['order_id']}]
          assert len(chosen)==2,chosen
          assert min(chosen,key=lambda x:x['start_time'])['order_id']==rows['LIVE-URGENT']['order_id'],(rows,chosen)
          print('LIVE ACCEPTANCE PASSED')
          PY
